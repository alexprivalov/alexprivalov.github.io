<!-- Click a post image to view it full size; arrows/keys flip through the images of the same slider. -->
<dialog id="lightbox" aria-label="Просмотр изображения">
  <img alt="">
  <button class="lb-prev" aria-label="Предыдущее">&#8249;</button>
  <button class="lb-next" aria-label="Следующее">&#8250;</button>
  <button class="lb-close" aria-label="Закрыть">&times;</button>
</dialog>
<style>
  .post img { cursor: zoom-in; }
  .post a img { cursor: pointer; }
  #lightbox { padding: 0; border: 0; background: transparent; max-width: 100vw; max-height: 100vh; overflow: visible; }
  #lightbox::backdrop { background: rgba(0, 0, 0, .88); }
  #lightbox img { display: block; max-width: 96vw; max-height: 92vh; margin: 0; border-radius: 0; cursor: zoom-out; }
  #lightbox button { position: fixed; background: none; border: 0; color: #fff; font-size: 3rem; line-height: 1; padding: .5rem 1rem; cursor: pointer; opacity: .75; }
  #lightbox button:hover, #lightbox button:focus-visible { opacity: 1; }
  #lightbox .lb-prev { left: .5rem; top: 50%; transform: translateY(-50%); }
  #lightbox .lb-next { right: .5rem; top: 50%; transform: translateY(-50%); }
  #lightbox .lb-close { right: .5rem; top: .5rem; font-size: 2.5rem; }
  #lightbox.single .lb-prev, #lightbox.single .lb-next { display: none; }
</style>
<script>
(function () {
  var box = document.getElementById("lightbox");
  if (!box || !box.showModal) return; // ponytail: no <dialog> support -> images just stay inline
  var view = box.querySelector("img"), group = [], i = 0;
  var srcOf = function (img) { return img.getAttribute("src").trim(); };
  function show(k) { i = (k + group.length) % group.length; view.src = group[i]; }
  document.addEventListener("click", function (e) {
    var img = e.target.closest && e.target.closest(".post img");
    if (!img || img.closest("a") || img.closest("#lightbox")) return;
    var slider = img.closest('[id^="slider"]');
    var imgs = slider ? slider.querySelectorAll('img[data-u="image"]') : [img];
    group = Array.from(new Set(Array.from(imgs, srcOf))); // jssor clones slides; dedupe by src
    box.classList.toggle("single", group.length < 2);
    show(group.indexOf(srcOf(img)));
    box.showModal();
  });
  box.addEventListener("click", function (e) {
    if (e.target.closest(".lb-prev")) show(i - 1);
    else if (e.target.closest(".lb-next")) show(i + 1);
    else box.close(); // image, backdrop or close button
  });
  box.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") show(i - 1);
    if (e.key === "ArrowRight") show(i + 1);
  });
})();
</script>
